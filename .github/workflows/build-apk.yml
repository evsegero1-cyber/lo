name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK уже установлен на раннерах GitHub (ANDROID_HOME)
      - name: Проверка Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Проверка расчётов (тесты)
        run: npm test

      - name: Сборка веб-части и Android-проекта
        run: |
          npm run build
          rm -rf android
          npx cap add android
          node scripts/android-setup.js
          npx cap sync android

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименование
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LIFE-OS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LIFE-OS-apk
          path: LIFE-OS.apk

      - name: Веб-версия для GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: www
        continue-on-error: true

  pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
